<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Watch & Earn Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Monetag SDK Tag -->
    <script src="https://alwingulla.com/88/tag.min.js" data-zone="11763247" async data-cfasync="false"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #384b56;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 10px;
            padding-bottom: 80px;
        }

        /* Top Bar & Active Search */
        .top-search-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }
        .user-icon {
            font-size: 20px;
            background: rgba(255, 255, 255, 0.15);
            padding: 6px;
            border-radius: 50%;
        }
        .search-box {
            flex: 1;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 6px 14px;
            display: flex;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .search-box input {
            background: transparent;
            border: none;
            color: white;
            width: 100%;
            outline: none;
            font-size: 13px;
        }
        .search-box input::placeholder {
            color: #cbd5e1;
        }

        /* Main Player Card */
        .main-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 18px;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 12px;
        }
        .video-title {
            font-size: 13px;
            color: #ffffff;
            margin-bottom: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: bold;
        }
        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
        }
        .video-container iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: 0;
        }

        /* Earn Progress Bar Section */
        .progress-box {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 12px;
            padding: 10px;
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .progress-info-text {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #ffd700;
            font-weight: bold;
        }
        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-bar-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #22c55e, #10b981);
        }

        /* Action Ad Buttons */
        .action-area {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }
        .btn-ad {
            flex: 1;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .btn-pop {
            flex: 1;
            background: linear-gradient(135deg, #ec4899, #db2777);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        /* Categories Bar */
        .category-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 10px;
        }
        .category-scroll::-webkit-scrollbar { display: none; }
        .tag {
            background: rgba(255, 255, 255, 0.15);
            padding: 6px 14px;
            border-radius: 15px;
            font-size: 12px;
            white-space: nowrap;
            cursor: pointer;
            user-select: none;
            border: 1px solid transparent;
        }
        .tag.active {
            background: #6366f1;
            font-weight: bold;
            border: 1px solid rgba(255,255,255,0.4);
        }

        /* Video List Items */
        .video-list-item {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 14px;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            cursor: pointer;
        }
        .list-thumb {
            width: 90px;
            height: 55px;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background-size: cover;
            background-position: center;
            position: relative;
        }
        .play-icon {
            font-size: 20px;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        }
        .list-info {
            flex: 1;
            overflow: hidden;
        }
        .list-title {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #ffffff;
        }
        .list-sub {
            font-size: 11px;
            color: #4ade80;
            font-weight: bold;
        }

        /* Bottom Navbar */
        .navbar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 60px;
            background: rgba(44, 58, 67, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 999;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 10px;
            color: #94a3b8;
            background: transparent;
            border: none;
            cursor: pointer;
        }
        .nav-item.active {
            color: #6366f1;
        }
        .nav-icon {
            font-size: 18px;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>

    <!-- Active Search Bar -->
    <div class="top-search-bar">
        <div class="user-icon">👤</div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="ကာတွန်းကား ရှာရန်..." oninput="handleSearch()">
            <span>🔍</span>
        </div>
        <div style="font-size: 12px; font-weight: bold; background: rgba(0,0,0,0.2); padding: 5px 10px; border-radius: 12px;">💰 <span id="points">0</span> Pts</div>
    </div>

    <!-- Main Player Card -->
    <div class="main-card">
        <div class="video-title" id="currentTitle">Oggy and the Cockroaches - Best Episodes</div>
        <div class="video-container">
            <iframe id="mainPlayer" src="https://www.youtube-nocookie.com/embed/P34aY5c7G3M?autoplay=0&rel=0" allowfullscreen></iframe>
        </div>
        <div class="progress-box">
            <div class="progress-info-text">
                <span>▶ ကြည့်ရှုပြီး ပိုက်ဆံရယူရန်</span>
                <span>+5 Points / Video</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill"></div>
            </div>
        </div>
    </div>

    <!-- Ad Action Buttons -->
    <div class="action-area">
        <button type="button" class="btn-ad" onclick="watchInterstitialAd()">🎥 Ads ကြည့်မည် (+10)</button>
        <button type="button" class="btn-pop" onclick="watchPopupAd()">🚀 Quick Ads (+5)</button>
    </div>

    <!-- Clickable Category Tags -->
    <div class="category-scroll">
        <div class="tag active" onclick="filterCategory('all', this)">အားလုံး</div>
        <div class="tag" onclick="filterCategory('oggy', this)">Oggy</div>
        <div class="tag" onclick="filterCategory('larva', this)">Larva</div>
        <div class="tag" onclick="filterCategory('tomjerry', this)">Tom & Jerry</div>
        <div class="tag" onclick="filterCategory('entertainment', this)">ဖျော်ဖြေရေး</div>
    </div>

    <!-- Dynamic Video List Items -->
    <div id="videoContainer"></div>

    <!-- Bottom Navigation -->
    <div class="navbar">
        <button type="button" class="nav-item active">
            <div class="nav-icon">📺</div>
            <span>ဗီဒီယို</span>
        </button>
        <button type="button" class="nav-item" onclick="watchInterstitialAd()">
            <div class="nav-icon">📋</div>
            <span>တာဝန်များ</span>
        </button>
        <button type="button" class="nav-item" onclick="watchPopupAd()">
            <div class="nav-icon">🏆</div>
            <span>ပွဲစဉ်</span>
        </button>
        <button type="button" class="nav-item" onclick="alert('ငွေထုတ်စနစ်ကို မကြာမီ ဖွင့်လှစ်ပေးပါမည်။');">
            <div class="nav-icon">💸</div>
            <span>ငွေထုတ်</span>
        </button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let points = 0;
        let currentCategory = 'all';

        // Updated Working Cartoon Videos List
        const videoData = [
            // Oggy & the Cockroaches
            { id: "P34aY5c7G3M", title: "Oggy and the Cockroaches - Funny Episodes", category: "oggy", reward: "+5 Points ကြည့်ရှုခ" },
            { id: "M0X8fP_P2Y4", title: "Oggy and the Cockroaches - Jack's Vacation", category: "oggy", reward: "+5 Points ကြည့်ရှုခ" },
            { id: "aC_G8s_G2S4", title: "Oggy and the Cockroaches - Best Chase", category: "oggy", reward: "+5 Points ကြည့်ရှုခ" },
            
            // Larva
            { id: "8-63S2C6s68", title: "Larva Funny Cartoon Compilation", category: "larva", reward: "+5 Points ကြည့်ရှုခ" },
            { id: "3U8y8E1-F_M", title: "Larva Season 3 Best Funny Moments", category: "larva", reward: "+5 Points ကြည့်ရှုခ" },
            { id: "P60f2yB3I_o", title: "Larva Island Full Clips", category: "larva", reward: "+5 Points ကြည့်ရှုခ" },
            
            // Tom & Jerry
            { id: "t06RUxPew_c", title: "Tom & Jerry Classic Compilation", category: "tomjerry", reward: "+5 Points ကြည့်ရှုခ" },
            { id: "kP9TfCWaQT4", title: "Tom & Jerry Best Chase Scenes", category: "tomjerry", reward: "+5 Points ကြည့်ရှုခ" },

            // Entertainment / ဖျော်ဖြေရေး
            { id: "328m31U43_U", title: "Mr Bean Animated Series Special", category: "entertainment", reward: "+5 Points ကြည့်ရှုခ" },
            { id: "KYniUCGPGLs", title: "Masha and the Bear Top Episodes", category: "entertainment", reward: "+5 Points ကြည့်ရှုခ" }
        ];

        function addPoints(amount) {
            points += amount;
            document.getElementById('points').innerText = points;
        }

        // Render List based on Category and Search Query
        function renderVideos(items) {
            const container = document.getElementById('videoContainer');
            container.innerHTML = '';

            if (items.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding: 20px; font-size: 12px; color: #cbd5e1;">ရှာဖွေမှု မတွေ့ရှိပါ။</div>`;
                return;
            }

            items.forEach(item => {
                const thumbUrl = `https://img.youtube.com/vi/${item.id}/hqdefault.jpg`;
                const embedUrl = `https://www.youtube-nocookie.com/embed/${item.id}?autoplay=1&rel=0`;

                const html = `
                    <div class="video-list-item" onclick="playVideo('${embedUrl}', '${item.title}')">
                        <div class="list-thumb" style="background-image: url('${thumbUrl}');">
                            <span class="play-icon">▶</span>
                        </div>
                        <div class="list-info">
                            <div class="list-title">${item.title}</div>
                            <div class="list-sub">🎁 ${item.reward}</div>
                        </div>
                    </div>
                `;
                container.innerHTML += html;
            });
        }

        // Search Bar Functionality
        function handleSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            
            const filtered = videoData.filter(item => {
                const matchCategory = currentCategory === 'all' || item.category === currentCategory;
                const matchSearch = item.title.toLowerCase().includes(query) || item.category.toLowerCase().includes(query);
                return matchCategory && matchSearch;
            });

            renderVideos(filtered);
        }

        // Change Category Tag
        function filterCategory(category, element) {
            currentCategory = category;
            document.querySelectorAll('.tag').forEach(tag => tag.classList.remove('active'));
            element.classList.add('active');
            handleSearch();
        }

        function playVideo(url, title) {
            document.getElementById('mainPlayer').src = url;
            document.getElementById('currentTitle').innerText = title;
            window.scrollTo({ top: 0, behavior: 'smooth' });
            addPoints(5);
        }

        // Initial Load
        renderVideos(videoData);

        // Monetag Ads
        function watchInterstitialAd() {
            if (typeof show_11763247 === 'function') {
                show_11763247().then(() => {
                    addPoints(10);
                    alert("ကြော်ငြာကြည့်ရှုခြင်း အောင်မြင်ပါသည်။ +10 Points ရရှိပါသည်။");
                }).catch(() => {
                    alert("ကြော်ငြာ မတက်သေးပါ၊ ခဏကြာမှ ပြန်ကြည့်ပေးပါခင်ဗျာ။");
                });
            } else {
                addPoints(10);
                alert("ကြော်ငြာကြည့်ရှုခြင်း အောင်မြင်ပါသည်။ +10 Points ရရှိပါသည်။");
            }
        }

        function watchPopupAd() {
            if (typeof show_11763247 === 'function') {
                show_11763247('pop').then(() => {
                    addPoints(5);
                    alert("Popup ကြော်ငြာ ကြည့်ရှုခြင်း အောင်မြင်ပါသည်။ +5 Points ရရှိပါသည်။");
                }).catch(() => {
                    alert("ကြော်ငြာ မတက်သေးပါ၊ ခဏကြာမှ ပြန်ကြည့်ပေးပါခင်ဗျာ။");
                });
            } else {
                addPoints(5);
                alert("Popup ကြော်ငြာ ကြည့်ရှုခြင်း အောင်မြင်ပါသည်။ +5 Points ရရှိပါသည်။");
            }
        }
    </script>
</body>
</html>
